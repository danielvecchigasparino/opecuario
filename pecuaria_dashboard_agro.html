<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPP · Arquitetura de Receita</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#08102a; --surface:#0e1a33; --surface-2:#121f3c; --line:#1d2b4d;
  --ink:#f6f4ef; --ink-2:#aeb6c4; --ink-3:#6e7890;
  --accent:#e06a1e;
  --s1:#d95926; --s2:#3987e5; --s3:#199e70; --s4:#b8891f; --s5:#9a6fd4;
  --neutro:#5b6780;
  --ok:#199e70; --warn:#b8891f; --bad:#d95926;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:60px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

header{border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 0 10px}
.brand b{font-size:17px;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--ink-3)}

/* filtro global */
.filtros{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);
  padding:7px 13px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1a0d02;font-weight:600}
.chip .pt{opacity:.75;font-size:11px;margin-left:5px}

/* navegacao */
nav{display:flex;gap:4px;overflow-x:auto;border-top:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-3);
  padding:11px 13px;font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
nav button:hover{color:var(--ink-2)}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.dot.full{background:var(--ok)} .dot.part{background:var(--warn)} .dot.none{background:var(--neutro)}

main{padding-top:22px}
section[hidden]{display:none}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);
  margin:26px 0 12px;font-weight:600}
h2:first-child{margin-top:0}

.grid{display:grid;gap:12px}
.g6{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.kpi-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);
  display:flex;align-items:center;gap:5px;margin-bottom:7px}
.kpi-v{font-size:25px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.kpi-s{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.vazio{color:var(--neutro)}

.selo{font-size:8.5px;letter-spacing:.06em;padding:2px 5px;border-radius:3px;
  border:1px solid var(--line);color:var(--ink-3);text-transform:uppercase;font-weight:600}
.selo.apurado{color:var(--ok);border-color:#15503c}
.selo.manual{color:var(--warn);border-color:#4a3a14}
.selo.plano{color:var(--s2);border-color:#1d3a5c}
.selo.sem{color:var(--neutro)}

.destaque{background:linear-gradient(180deg,var(--surface-2),var(--surface));
  border:1px solid #2b3a5e;border-radius:var(--r);padding:17px;display:flex;
  gap:18px;align-items:center;flex-wrap:wrap}
.destaque .n{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--accent)}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
tbody tr:last-child td{border-bottom:0}
tr.sep td{border-top:2px solid var(--line);color:var(--ink-2)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}

.nota{border-left:3px solid var(--line);padding:11px 13px;background:var(--surface);
  border-radius:0 var(--r) var(--r) 0;font-size:13px;color:var(--ink-2);line-height:1.6}
.nota.alerta{border-left-color:var(--warn)}
.nota.ok{border-left-color:var(--ok)}
.nota b{color:var(--ink)}

.agulha{border:1px dashed #2b3a5e;border-radius:var(--r);padding:20px;background:#0b1428}
.agulha .t{font-size:14px;font-weight:600;margin-bottom:7px;color:var(--ink-2)}
.agulha .d{font-size:13px;color:var(--ink-3);line-height:1.65}
.agulha ol{margin:11px 0 0 17px;font-size:12.5px;color:var(--ink-3);line-height:1.7}

.cw{position:relative;height:300px;width:100%}
.cw.alto{height:360px}
/* Sem isto o canvas do Chart.js mantem a largura antiga ao estreitar a tela e
   empurra a pagina inteira — filho de grid/flex nao encolhe sem min-width:0. */
canvas{max-width:100%!important}
.card,.grid>*{min-width:0}

.legenda{display:flex;flex-wrap:wrap;gap:12px;margin-top:11px;font-size:12px;color:var(--ink-2)}
.legenda i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ink-3);line-height:1.7}
code{background:var(--surface-2);padding:1px 5px;border-radius:3px;font-size:.92em}

@media(max-width:620px){
  .kpi-v{font-size:21px} .destaque .n{font-size:32px} .cw{height:260px}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <b>🌱 PPP · Arquitetura de Receita</b>
      <span id="selo-build"></span>
    </div>
    <div class="filtros" id="filtros" role="group" aria-label="Filtrar por campanha"></div>
    <nav id="nav" role="tablist"></nav>
  </div>
</header>

<main class="wrap">
  <section id="t-caixa" role="tabpanel"></section>
  <section id="t-marketing" role="tabpanel" hidden></section>
  <section id="t-vendas" role="tabpanel" hidden></section>
  <section id="t-cs" role="tabpanel" hidden></section>
  <section id="t-produto" role="tabpanel" hidden></section>

  <footer class="wrap" style="padding:15px 0 0">
    <b style="color:var(--ink-2)">Como ler.</b>
    <code>0</code> é medição: foi medido e deu zero.
    <code>—</code> é ausência: não existe fonte. Os dois nunca têm a mesma aparência.<br>
    <span id="rodape-fonte"></span>
  </footer>
</main>

<script>
// ═══════════════════════════════════════════════════════════════════
// PPP — ARQUITETURA DE RECEITA
// Apuração: export Eduzz "Simples" PPP de 07/10/2026 (498 faturas) +
//           export Eduzz "Simples" PAA de 07/10/2026 (1.643 faturas).
//
// GRÃO: dinheiro = fatura com Status "Paga", NÃO-parcela (campo Contrato vazio),
//       pela DATA DE PAGAMENTO. Aluno = CPF cuja PRIMEIRA fatura paga cai na janela.
// EXCLUÍDO: 2 CPFs com cupom CUPOMTESTE (3 faturas de R$1,00 em 08/06) — transações
//       de teste, não alunos. Declarado aqui em vez de sumir em silêncio.
// INVESTIMENTO: não vem do export (a Eduzz não conhece mídia). Vem do painel
//       anterior, colado à mão. Por isso carrega selo MANUAL.
// ═══════════════════════════════════════════════════════════════════
const BUILD = { versao:'1.0', data:'2026-10-08', fonte:'Eduzz 07/10/2026' };

// fonte: APURADO (export) · MANUAL (colado) · DERIVADO (conta) · PLANO · null (sem fonte)
const CAMPANHAS = [
  { id:'#01', nome:'MAI-26', ini:'13/04', fim:'11/05', ano:2026,
    inv:null, bruto:null, liq:null, alunos:null, reemb:null, canais:null,
    fonte:{inv:null,receita:null},
    nota:'O export da Eduzz começa em 08/06/2026. Esta campanha inteira está fora dele.' },

  { id:'#02', nome:'JUN-26', ini:'08/06', fim:'08/07', ano:2026,
    inv:16357.73, bruto:76620.45, liq:68260.94, alunos:248, reemb:3,
    canais:{ 'WhatsApp':86, 'Meta':69, 'Sem UTM':60, 'Comercial/Afiliado':22, 'E-mail':9, 'Recup. Eduzz':2 },
    fonte:{inv:'MANUAL',receita:'APURADO'} },

  { id:'#03', nome:'AGO-26', ini:'10/08', fim:'13/09', ano:2026,
    inv:18498.07, bruto:42608.24, liq:37835.46, alunos:125, reemb:3,
    canais:{ 'Meta':53, 'WhatsApp':38, 'Comercial/Afiliado':14, 'Sem UTM':14, 'E-mail':2, 'Recup. Eduzz':2, 'Outros':2 },
    fonte:{inv:'MANUAL',receita:'APURADO'} },

  { id:'#04', nome:'OUT-26', ini:'13/10', fim:'09/11', ano:2026,
    inv:19001, bruto:null, liq:null, alunos:null, reemb:null, canais:null,
    fonte:{inv:'PLANO',receita:null},
    nota:'Campanha futura. A verba é o plano aprovado de 28 dias; nenhuma receita existe ainda.' },
];

// Vendas fora de qualquer janela de campanha. Não é ciclo: é o piso do downsell sem lançamento.
const ENTRE_CICLOS = { ini:'14/09', fim:'06/10', alunos:12, bruto:3064.98, dias:23,
  canais:{ 'WhatsApp':5, 'Comercial/Afiliado':5, 'Meta':2 } };

const BASE = { alunosTotais:403, cpfsNoExport:405, excluidosTeste:2,
  obs:'CPF com ao menos uma fatura paga no export de 07/10. 405 brutos − 2 CPFs de teste = 403.' };

// Método de pagamento — todas as faturas pagas do export (não recortado por campanha).
const PAGAMENTO = [ {n:'Pix',q:217}, {n:'Crédito',q:172}, {n:'Boleto',q:33} ];

// Série de preço do PPP. Fonte: painel anterior (série histórica), não o export.
const PRECO = [
  {ciclo:'Abr/26', ticket:297, vendas:192}, {ciclo:'Jun/26', ticket:297, vendas:248},
  {ciclo:'Ago/26', ticket:349, vendas:125}, {ciclo:'Out/26', ticket:349, vendas:null},
];

// Esteira PPP→PAA. Fonte: cruzamento dos dois exports por CPF, 07/10/2026.
const ESTEIRA = { ambos:29, pppPrimeiro:16, paaPrimeiro:13, totalPaa:636, baseP:403 };

// Voice of Customer. Fonte: estudo de 2026-08-27, 46.559 verbatins.
const VOC = { impedConhecimento:5288, impedDinheiro:2967,
  segmentos:[ {n:'Outra profissão + gado',p:52}, {n:'Quer começar',p:34}, {n:'Vive da pecuária',p:13.6} ] };

const CORES = { 'Meta':'#d95926','WhatsApp':'#3987e5','Comercial/Afiliado':'#199e70',
  'E-mail':'#b8891f','Recup. Eduzz':'#9a6fd4','Outros':'#9a6fd4','Sem UTM':'#5b6780' };

// ───────────────────────────── utilidades ─────────────────────────────
const nn = v => v===null||v===undefined||Number.isNaN(v);
const R   = v => nn(v) ? '—' : 'R$ '+Math.round(v).toLocaleString('pt-BR');
const R2  = v => nn(v) ? '—' : 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const N   = v => nn(v) ? '—' : Math.round(v).toLocaleString('pt-BR');
const X   = v => nn(v) ? '—' : v.toFixed(2).replace('.',',')+'x';
const P   = (v,d=1) => nn(v) ? '—' : (v*100).toFixed(d).replace('.',',')+'%';
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el  = id => document.getElementById(id);
const selo = t => t ? `<span class="selo ${t.toLowerCase()}">${t}</span>` : `<span class="selo sem">sem fonte</span>`;
const vz = v => nn(v) ? '<span class="vazio">—</span>' : v;

let FILTRO = 'TODAS';
const charts = {};
function chart(id, cfg){ if(charts[id]) charts[id].destroy(); const c=el(id); if(c) charts[id]=new Chart(c,cfg); }

Chart.defaults.color = '#aeb6c4';
Chart.defaults.font.family = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
Chart.defaults.font.size = 11;
Chart.defaults.borderColor = '#1d2b4d';

function recorte(){
  if(FILTRO==='TODAS') return CAMPANHAS.filter(c=>c.bruto!==null||c.inv!==null);
  return CAMPANHAS.filter(c=>c.id===FILTRO);
}
// só entram na soma as campanhas que têm AMBOS: investimento real e receita apurada
function somaveis(){ return recorte().filter(c=>c.bruto!==null && c.inv!==null && c.fonte.inv!=='PLANO'); }

function agregado(){
  const s = somaveis();
  const inv = s.reduce((a,c)=>a+c.inv,0), bruto = s.reduce((a,c)=>a+c.bruto,0);
  const liq = s.reduce((a,c)=>a+c.liq,0), al = s.reduce((a,c)=>a+c.alunos,0);
  if(!s.length) return {n:0};
  return { n:s.length, inv, bruto, liq, alunos:al, lucro:bruto-inv,
           roas:bruto/inv, cac:inv/al, taxa:1-liq/bruto, ticket:bruto/al };
}

// ───────────────────────────── TELA 1 · CAIXA ─────────────────────────────
function telaCaixa(){
  const a = agregado();
  const semDado = a.n===0;
  const alvo = FILTRO==='TODAS' ? `${a.n} de ${CAMPANHAS.length} campanhas` : FILTRO;

  const kpis = semDado ? '' : `
  <div class="grid g6">
    <div class="card"><div class="kpi-l">Investimento em tráfego ${selo('MANUAL')}</div>
      <div class="kpi-v">${R(a.inv)}</div><div class="kpi-s">${alvo}</div></div>
    <div class="card"><div class="kpi-l">Faturamento bruto ${selo('APURADO')}</div>
      <div class="kpi-v">${R(a.bruto)}</div><div class="kpi-s">${N(a.alunos)} alunos · ticket ${R(a.ticket)}</div></div>
    <div class="card"><div class="kpi-l">Lucro de mídia ${selo('DERIVADO')}</div>
      <div class="kpi-v" style="color:var(--ok)">${R(a.lucro)}</div>
      <div class="kpi-s">bruto − tráfego</div></div>
    <div class="card"><div class="kpi-l">ROAS de caixa ${selo('DERIVADO')}</div>
      <div class="kpi-v">${X(a.roas)}</div><div class="kpi-s">bruto ÷ tráfego</div></div>
    <div class="card"><div class="kpi-l">CAC ${selo('DERIVADO')}</div>
      <div class="kpi-v">${R2(a.cac)}</div><div class="kpi-s">tráfego ÷ alunos novos</div></div>
    <div class="card"><div class="kpi-l">Faturamento líquido ${selo('APURADO')}</div>
      <div class="kpi-v">${R(a.liq)}</div><div class="kpi-s">pós-taxa Eduzz · ${P(a.taxa)} efetiva</div></div>
  </div>`;

  const vazio = !semDado ? '' : `
  <div class="agulha"><div class="t">Sem dado de receita para este recorte</div>
    <div class="d">${esc(CAMPANHAS.find(c=>c.id===FILTRO)?.nota || 'Nenhuma campanha do recorte tem receita apurada.')}</div></div>`;

  el('t-caixa').innerHTML = `
  ${kpis}${vazio}

  <div class="destaque" style="margin-top:12px">
    <div><div class="kpi-l" style="margin-bottom:4px">Alunos totais ${selo('APURADO')}</div>
      <div class="n">${N(BASE.alunosTotais)}</div></div>
    <div style="flex:1;min-width:230px;font-size:12.5px;color:var(--ink-3);line-height:1.6">
      ${esc(BASE.obs)}<br>Este número <b style="color:var(--ink-2)">não muda com o filtro</b> — é a base instalada
      inteira. Para alunos do recorte, veja o cartão de CAC.</div>
  </div>

  <h2>As quatro campanhas</h2>
  <div class="card"><div class="cw alto"><canvas id="c-heroi"></canvas></div>
    <div class="legenda">
      <span><i style="background:var(--s1)"></i>Custo de tráfego</span>
      <span><i style="background:var(--s3)"></i>Lucro de mídia</span>
      <span><i style="background:var(--neutro);opacity:.45"></i>Sem fonte / planejado</span>
    </div>
    <div class="kpi-s" style="margin-top:9px">O comprimento total da barra é o faturamento bruto.
      MAI-26 não tem fonte; OUT-26 tem só verba planejada.</div></div>

  <div class="tw card" style="margin-top:12px">
    <table><thead><tr><th>Campanha</th><th>Janela</th><th>Investimento</th><th>Fat. bruto</th>
      <th>Lucro de mídia</th><th>ROAS</th><th>Alunos</th><th>CAC</th><th>Reemb.</th></tr></thead>
    <tbody>${CAMPANHAS.map(c=>`<tr>
      <td><b>${c.id}</b> ${c.nome}</td><td>${c.ini}–${c.fim}</td>
      <td>${vz(c.inv===null?null:R(c.inv))} ${c.fonte.inv?selo(c.fonte.inv):''}</td>
      <td>${vz(c.bruto===null?null:R(c.bruto))}</td>
      <td>${vz(c.bruto===null||c.inv===null||c.fonte.inv==='PLANO'?null:R(c.bruto-c.inv))}</td>
      <td>${vz(c.bruto===null||c.inv===null||c.fonte.inv==='PLANO'?null:X(c.bruto/c.inv))}</td>
      <td>${vz(c.alunos===null?null:N(c.alunos))}</td>
      <td>${vz(c.alunos===null||c.inv===null||c.fonte.inv==='PLANO'?null:R2(c.inv/c.alunos))}</td>
      <td>${vz(c.reemb===null?null:c.reemb)}</td></tr>`).join('')}
      <tr class="sep"><td>Entre ciclos</td><td>${ENTRE_CICLOS.ini}–${ENTRE_CICLOS.fim}</td>
      <td><span class="vazio">—</span></td><td>${R(ENTRE_CICLOS.bruto)}</td>
      <td><span class="vazio">—</span></td><td><span class="vazio">—</span></td>
      <td>${ENTRE_CICLOS.alunos}</td><td><span class="vazio">—</span></td><td>0</td></tr>
    </tbody></table>
  </div>

  <div class="nota ok" style="margin-top:12px"><b>O piso do downsell.</b>
    Em ${ENTRE_CICLOS.dias} dias sem campanha nenhuma (${ENTRE_CICLOS.ini}–${ENTRE_CICLOS.fim}) entraram
    ${ENTRE_CICLOS.alunos} alunos e ${R(ENTRE_CICLOS.bruto)}, sem verba de tráfego atribuída.
    É o que o produto entrega sozinho — e a régua contra a qual qualquer campanha deveria ser medida.</div>`;

  const comp = CAMPANHAS.map(c=>c.bruto!==null&&c.inv!==null&&c.fonte.inv!=='PLANO'?c.inv:(c.fonte.inv==='PLANO'?c.inv:0));
  const luc  = CAMPANHAS.map(c=>c.bruto!==null&&c.inv!==null&&c.fonte.inv!=='PLANO'?c.bruto-c.inv:0);
  // Barra de largura zero desaparece, e desaparecer parece linha faltando em vez de
  // "sem fonte". Este plugin escreve o motivo no lugar onde a barra estaria.
  const marcaVazio = { id:'marcaVazio', afterDatasetsDraw(c){
    const {ctx, scales:{x,y}} = c;
    CAMPANHAS.forEach((cp,i)=>{
      if(cp.bruto!==null || cp.fonte.inv==='PLANO') return;
      ctx.save();
      ctx.fillStyle='#5b6780'; ctx.font='italic 11px system-ui,sans-serif';
      ctx.textBaseline='middle';
      ctx.fillText('sem fonte de dado', x.getPixelForValue(0)+8, y.getPixelForValue(i));
      ctx.restore();
    });
  }};

  chart('c-heroi',{ type:'bar', plugins:[marcaVazio], data:{
      labels: CAMPANHAS.map(c=>`${c.id} ${c.nome}`),
      datasets:[
        { label:'Custo de tráfego', data:comp, backgroundColor:CAMPANHAS.map(c=>c.fonte.inv==='PLANO'?'rgba(91,103,128,.35)':'#d95926'),
          borderColor:CAMPANHAS.map(c=>c.fonte.inv==='PLANO'?'#5b6780':'transparent'),
          borderWidth:CAMPANHAS.map(c=>c.fonte.inv==='PLANO'?1.5:0), borderRadius:3, barThickness:26 },
        { label:'Lucro de mídia', data:luc, backgroundColor:'#199e70', borderRadius:{topRight:4,bottomRight:4}, barThickness:26 },
      ]},
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      scales:{ x:{stacked:true,grid:{color:'#15213d'},ticks:{callback:v=>'R$ '+(v/1000)+'k'}},
               y:{stacked:true,grid:{display:false}} },
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{ label:ctx=>{
          const c=CAMPANHAS[ctx.dataIndex];
          if(c.bruto===null && c.fonte.inv!=='PLANO') return 'Sem fonte de dado';
          if(c.fonte.inv==='PLANO') return 'Verba planejada: '+R(c.inv)+' · sem receita ainda';
          return ctx.dataset.label+': '+R(ctx.raw); } } } } }});
}

// ───────────────────────────── TELA 2 · MARKETING ─────────────────────────────
function telaMarketing(){
  const cs = recorte().filter(c=>c.canais);
  const semUtm = cs.reduce((a,c)=>a+(c.canais['Sem UTM']||0),0);
  const totAl  = cs.reduce((a,c)=>a+c.alunos,0);
  const ordem = ['Meta','WhatsApp','Comercial/Afiliado','E-mail','Recup. Eduzz','Outros','Sem UTM'];

  el('t-marketing').innerHTML = cs.length===0 ? semFonte('Marketing',
    'Nenhuma campanha do recorte tem alunos com origem rastreada.') : `
  <h2>Os dois modais de venda</h2>
  <div class="nota alerta"><b>O tráfego pago é o único modal com investimento mensurável.</b>
    O orgânico — WhatsApp, comercial, e-mail, recuperação — não tem custo de mídia atribuível,
    então ROI por canal só existe para o pago. Para os demais, o dashboard mostra <b>volume de alunos</b>,
    nunca um ROI inventado a partir de custo zero.</div>

  <div class="grid g2" style="margin-top:12px">
    <div class="card"><div class="kpi-l">Alunos por canal de origem ${selo('APURADO')}</div>
      <div class="cw"><canvas id="c-canais"></canvas></div></div>
    <div class="card"><div class="kpi-l">Qualidade da atribuição</div>
      <div class="kpi-v" style="color:${semUtm/totAl>.15?'var(--bad)':'var(--warn)'}">${P(semUtm/totAl)}</div>
      <div class="kpi-s">dos alunos do recorte não têm UTM de origem (${semUtm} de ${totAl})</div>
      <div class="nota alerta" style="margin-top:13px">Toda divisão por canal abaixo carrega essa margem.
        Com ${P(semUtm/totAl)} sem origem, o share de cada canal é <b>piso</b>, não medida.
        ${FILTRO==='TODAS'||FILTRO==='#02' ? 'Em JUN-26 o buraco foi de 24,2% — quase um quarto do faturamento sem rastro.' : ''}</div>
    </div>
  </div>

  <h2>Gestão de criativos</h2>
  <div class="agulha"><div class="t">Não conectado — o dado não está na Eduzz</div>
    <div class="d">Performance por criativo mora no <b>Meta Ads</b>. O export da Eduzz traz
      <code>UTM content</code>, mas ele está esparso e fora do padrão de nomenclatura: não dá para
      reconstruir qual criativo gerou qual venda sem a outra ponta.</div>
    <ol>
      <li>Conectar a API do Meta Ads (ou exportar o relatório de anúncios por campanha) — traz gasto, impressão, CTR e CPA por criativo.</li>
      <li>Padronizar o <code>utm_content</code> com o ID do criativo em <b>todos</b> os anúncios de OUT-26, antes de 13/10.</li>
      <li>Corrigir o template quebrado: 2 anúncios de AGO-26 gravaram <code>{{site_source_name}}</code> literal, macro não renderizada.</li>
    </ol>
    <div class="d" style="margin-top:11px">Feito isso, esta seção passa a cruzar gasto por criativo
      com venda por criativo — que é o insumo do PDCA/SDCA de fim de campanha.</div></div>

  <h2>Páginas</h2>
  <div class="agulha"><div class="t">Não medido — falta analytics por página</div>
    <div class="d">Landing, VSL e checkout não têm taxa de conversão apurada em lugar nenhum.
      O export da Eduzz só enxerga a fatura: quem chegou e não comprou é invisível.
      Precisa de evento de página (GA4, Meta Pixel ou servidor) para existir.</div></div>`;

  if(cs.length){
    const tot={}; ordem.forEach(k=>{ const v=cs.reduce((a,c)=>a+(c.canais[k]||0),0); if(v) tot[k]=v; });
    const ks=Object.keys(tot);
    chart('c-canais',{ type:'bar', data:{ labels:ks,
      datasets:[{ data:ks.map(k=>tot[k]), backgroundColor:ks.map(k=>CORES[k]||'#9a6fd4'),
        borderRadius:{topLeft:4,topRight:4}, barPercentage:.72 }]},
      options:{ responsive:true, maintainAspectRatio:false,
        scales:{ y:{beginAtZero:true,grid:{color:'#15213d'}}, x:{grid:{display:false},ticks:{maxRotation:40,minRotation:0}} },
        plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c=>`${c.raw} alunos · ${P(c.raw/totAl)}`}} } }});
  }
}

// ───────────────────────────── TELA 3 · VENDAS ─────────────────────────────
function telaVendas(){
  const cs = recorte().filter(c=>c.canais);
  const com = cs.reduce((a,c)=>a+(c.canais['Comercial/Afiliado']||0),0);
  const totAl = cs.reduce((a,c)=>a+c.alunos,0);
  const totP = PAGAMENTO.reduce((a,p)=>a+p.q,0);

  el('t-vendas').innerHTML = `
  <div class="nota alerta"><b>O PPP é venda self-service.</b> Não existe funil de vendas, etapa,
    nem vendedor por venda — o produto é um downsell de checkout direto. O que esta tela mostra é
    o que de fato existe: o pedaço que passou por pessoa, e como o dinheiro entrou.</div>

  <div class="grid g2" style="margin-top:12px">
    <div class="card"><div class="kpi-l">Alunos via comercial / afiliado ${selo('APURADO')}</div>
      <div class="kpi-v">${cs.length?N(com):'—'}</div>
      <div class="kpi-s">${cs.length?P(com/totAl)+' dos alunos do recorte':'sem dado no recorte'}</div>
      <div class="kpi-s" style="margin-top:9px">Identificados por UTM de pessoa
        (<code>patricia</code>, <code>guima</code>, <code>vitor</code>, <code>nauani</code>).
        Não há registro de quem fechou cada venda — só a origem do link.</div></div>

    <div class="card"><div class="kpi-l">Método de pagamento ${selo('APURADO')}</div>
      <div class="cw" style="height:218px"><canvas id="c-pag"></canvas></div>
      <div class="kpi-s" style="margin-top:9px">Todas as ${totP} faturas pagas do export,
        sem recorte por campanha.</div></div>
  </div>

  <h2>O que falta para esta área existir de verdade</h2>
  <div class="agulha"><div class="t">Sem fonte: funil, etapa e conversão</div>
    <div class="d">Para medir vendas seria preciso saber quantas pessoas chegaram ao checkout e
      não compraram, e em que etapa pararam. A Eduzz só registra a fatura criada — o abandono
      anterior a ela não existe em nenhum dado que temos.</div>
    <ol><li>Evento de checkout iniciado (Meta Pixel ou GA4) para ter denominador.</li>
      <li>Se o comercial passar a atuar, registrar o responsável por venda — hoje o UTM
        identifica o link, não a pessoa que fechou.</li></ol></div>`;

  chart('c-pag',{ type:'bar', data:{ labels:PAGAMENTO.map(p=>p.n),
    datasets:[{ data:PAGAMENTO.map(p=>p.q), backgroundColor:['#3987e5','#d95926','#b8891f'],
      borderRadius:3, barThickness:30 }]},
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      scales:{ x:{beginAtZero:true,grid:{color:'#15213d'}}, y:{grid:{display:false}} },
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c=>`${c.raw} faturas · ${P(c.raw/totP)}`}} } }});
}

// ───────────────────────────── TELA 4 · CS ─────────────────────────────
function telaCS(){
  const cs = recorte().filter(c=>c.reemb!==null && c.alunos);
  const re = cs.reduce((a,c)=>a+c.reemb,0), al = cs.reduce((a,c)=>a+c.alunos,0);

  el('t-cs').innerHTML = `
  <div class="grid g2">
    <div class="card"><div class="kpi-l">Taxa de reembolso ${selo('APURADO')}</div>
      <div class="kpi-v" style="color:var(--ok)">${cs.length?P(re/al,2):'—'}</div>
      <div class="kpi-s">${cs.length?`${re} reembolsos em ${N(al)} alunos do recorte`:'sem dado no recorte'}</div>
      <div class="kpi-s" style="margin-top:9px">É a <b>única</b> métrica de satisfação que existe hoje —
        e mede insatisfação extrema, não satisfação.</div></div>

    <div class="card"><div class="kpi-l">Base instalada sem contato ${selo('DERIVADO')}</div>
      <div class="kpi-v">${N(BASE.alunosTotais)}</div>
      <div class="kpi-s">alunos que nunca receberam pesquisa nenhuma</div>
      <div class="kpi-s" style="margin-top:9px">O SKU de R$ 349 não inclui suporte, grupo nem
        acompanhamento. Não existe canal de relacionamento com essa base hoje.</div></div>
  </div>

  <h2>Satisfação</h2>
  <div class="agulha"><div class="t">Não medido — a pesquisa foi desenhada e não rodou</div>
    <div class="d">Sem NPS, sem CSAT, sem verbatim de aluno. O instrumento de pesquisa existe
      (5 blocos, cadência casada com água/seca, regra de roteamento), mas nenhum disparo aconteceu.
      Enquanto isso, <b>reembolso é o único sinal</b>, e ele só captura quem foi embora.</div>
    <ol>
      <li>Fechar a lista de convite por CPF — já apurada: <b>364 alunos</b> com WhatsApp válido,
        sem reembolso e que não compraram o PAA.</li>
      <li>Rodar o Bloco 0 (cadastro de entrada) — é ele que preenche porte e aplicação, hoje vazios.</li>
      <li>Bloco 2 (NPS + causa) a cada 90 dias. Aí esta tela ganha número.</li>
    </ol></div>`;
}

// ───────────────────────────── TELA 5 · PRODUTO ─────────────────────────────
function telaProduto(){
  el('t-produto').innerHTML = `
  <h2>Efeito de preço</h2>
  <div class="card"><div class="cw"><canvas id="c-preco"></canvas></div>
    <div class="legenda"><span><i style="background:var(--s2)"></i>Alunos por ciclo</span></div>
    <div class="kpi-s" style="margin-top:9px">O ticket subiu de R$ 297 para R$ 349 (+17,5%) em Ago/26,
      e o volume caiu de 248 para 125 (−49,6%). Tráfego e WhatsApp caíram juntos no mesmo ciclo,
      então <b>preço e execução de mídia não estão separados</b> — este gráfico levanta a pergunta, não a responde.</div></div>

  <h2>Esteira PPP → PAA</h2>
  <div class="grid g2" style="margin-top:12px">
    <div class="card"><div class="kpi-l">Alunos de PPP que também compraram o PAA ${selo('APURADO')}</div>
      <div class="kpi-v">${ESTEIRA.ambos}</div>
      <div class="kpi-s">de ${ESTEIRA.baseP} alunos de PPP · ${P(ESTEIRA.ambos/ESTEIRA.baseP)}</div>
      <div class="nota alerta" style="margin-top:13px">Só <b>${ESTEIRA.pppPrimeiro}</b> fizeram
        PPP antes do PAA. Os outros ${ESTEIRA.paaPrimeiro} vieram no sentido inverso.
        Com ${ESTEIRA.totalPaa} compradores de PAA no total, a escada de upsell praticamente não existe —
        e isso é decisão de oferta, não de targeting.</div></div>

    <div class="card"><div class="kpi-l">Quem é esse aluno ${selo('MANUAL')}</div>
      ${VOC.segmentos.map(s=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)">
        <span style="font-size:13px">${esc(s.n)}</span><b>${String(s.p).replace('.',',')}%</b></div>`).join('')}
      <div class="kpi-s" style="margin-top:11px">Estudo Voice of Customer, 46.559 verbatins (27/08/2026).
        Impedimento nº1 é <b>conhecimento</b> (${N(VOC.impedConhecimento)} menções),
        ~2× dinheiro (${N(VOC.impedDinheiro)}).</div></div>
  </div>

  <h2>Consumo do produto</h2>
  <div class="agulha"><div class="t">Não conectado — a API de progresso do portal</div>
    <div class="d">Ninguém sabe quem assistiu o quê. Sem isso não existe taxa de conclusão, nem
      separar "não teve resultado" de "nunca abriu o portal" — que é a diferença entre um problema
      de produto e um problema de ativação.</div>
    <ol><li>Confirmar se o portal é <b>Nutror ou Alpaclass</b> — são APIs distintas e a errada devolve vazio, não erro.</li>
      <li><code>GET /students?email=</code> → <code>/students/{id}/enrollments</code> devolve <code>progress (%)</code>, 200 req/min.</li>
      <li>Com isso, os campos <code>aluno_progresso__pct</code>, <code>porte__cabecas</code> e
        <code>porte__hectares</code> do SSOT saem do vazio.</li></ol></div>`;

  const cp = PRECO.filter(p=>p.vendas!==null);
  chart('c-preco',{ type:'bar', data:{ labels:cp.map(p=>`${p.ciclo}\nR$ ${p.ticket}`),
    datasets:[{ data:cp.map(p=>p.vendas), backgroundColor:cp.map(p=>p.ticket===349?'#d95926':'#3987e5'),
      borderRadius:{topLeft:4,topRight:4}, barPercentage:.6 }]},
    options:{ responsive:true, maintainAspectRatio:false,
      scales:{ y:{beginAtZero:true,grid:{color:'#15213d'},title:{display:true,text:'alunos'}},
               x:{grid:{display:false}} },
      plugins:{ legend:{display:false},
        tooltip:{callbacks:{label:c=>`${c.raw} alunos a R$ ${cp[c.dataIndex].ticket}`}} } }});
}

function semFonte(area,txt){
  return `<div class="agulha"><div class="t">${esc(area)} — sem dado para este recorte</div>
    <div class="d">${esc(txt)}</div></div>`;
}

// ───────────────────────────── navegação e filtros ─────────────────────────────
const TELAS = [
  { id:'caixa',     rot:'Caixa',            st:'full', fn:telaCaixa },
  { id:'marketing', rot:'Marketing',        st:'full', fn:telaMarketing },
  { id:'vendas',    rot:'Vendas',           st:'part', fn:telaVendas },
  { id:'cs',        rot:'Customer Success', st:'part', fn:telaCS },
  { id:'produto',   rot:'Produto',          st:'part', fn:telaProduto },
];
let ATUAL = 'caixa';

function render(){
  TELAS.forEach(t=>{ el('t-'+t.id).hidden = t.id!==ATUAL; });
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-selected', b.dataset.id===ATUAL));
  document.querySelectorAll('#filtros .chip').forEach(b=>b.setAttribute('aria-pressed', b.dataset.f===FILTRO));
  TELAS.find(t=>t.id===ATUAL).fn();
  if(location.hash.slice(1)!==ATUAL) history.replaceState(null,'','#'+ATUAL);
}

function montar(){
  el('selo-build').innerHTML = `v${BUILD.versao} · apurado em ${BUILD.data.split('-').reverse().join('/')}`;
  el('rodape-fonte').innerHTML =
    `Fonte: exports Eduzz "Simples" de 07/10/2026 — PPP 498 faturas, PAA 1.643. `+
    `Dinheiro por fatura paga não-parcela, pela data de pagamento. Aluno por CPF de primeira compra paga. `+
    `${BASE.excluidosTeste} CPFs de teste (cupom CUPOMTESTE) excluídos. `+
    `Investimento em tráfego é colado à mão: a Eduzz não conhece mídia.`;

  el('filtros').innerHTML = `<button class="chip" data-f="TODAS">Todas as campanhas</button>` +
    CAMPANHAS.map(c=>{
      const pt = c.bruto!==null ? '●' : (c.fonte.inv==='PLANO' ? '○' : '—');
      return `<button class="chip" data-f="${c.id}">${c.id} ${c.nome}<span class="pt">${pt}</span></button>`;
    }).join('');
  el('filtros').onclick = e => { const b=e.target.closest('.chip'); if(!b) return; FILTRO=b.dataset.f; render(); };

  el('nav').innerHTML = TELAS.map(t=>
    `<button role="tab" data-id="${t.id}"><span class="dot ${t.st}"></span>${t.rot}</button>`).join('');
  el('nav').onclick = e => { const b=e.target.closest('button'); if(!b) return; ATUAL=b.dataset.id; render(); };

  const h=location.hash.slice(1); if(TELAS.some(t=>t.id===h)) ATUAL=h;
  render();
}
montar();
</script>
</body>
</html>
